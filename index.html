
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4A90E2">
<meta name="description" content="Vaterina - Manage your pets and veterinary care in one place.">
<title>Vaterina | Pet Care</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#F7FAFC;
  --surface:#FFFFFF;
  --blue:#4A90E2;
  --blue-light:#EAF4FF;
  --green:#43B581;
  --green-light:#E8F8EF;
  --text:#172B3A;
  --muted:#718096;
  --border:#E2EAF0;
  --warning:#F4B942;
  --danger:#E45858;
  --radius:18px;
  --shadow:0 8px 28px rgba(36,72,105,.07);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(24px,4vw,32px);margin-bottom:8px}
h2{font-size:20px}
h3{font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,a:focus-visible{
  outline:3px solid #8BC2FF;outline-offset:2px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;border:0;border-radius:11px;padding:11px 16px;
  font-weight:650;transition:background .2s,transform .2s;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:white}
.btn-primary:hover{background:#347DCB}
.btn-soft{background:var(--blue-light);color:#2466A8}
.btn-green{background:var(--green-light);color:#247B51}
.btn-danger{background:#FFF0F0;color:#B93131}
.btn-outline{background:white;border:1px solid var(--border);color:var(--text)}
.btn-block{width:100%}
input,select,textarea{
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:10px;background:white;color:var(--text);
}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.field{margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.span-2{grid-column:1/-1}
hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.app-layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}
.sidebar{
  background:white;border-right:1px solid var(--border);
  padding:25px 16px;display:flex;flex-direction:column;gap:25px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-icon{
  width:43px;height:43px;border-radius:14px;background:var(--blue-light);
  display:grid;place-items:center;font-size:24px;
}
.brand strong{font-size:20px;letter-spacing:-.6px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.nav-label{
  padding:0 12px;color:var(--muted);font-size:11px;
  font-weight:800;text-transform:uppercase;letter-spacing:1px;
}
.nav-list{display:grid;gap:5px}
.nav-btn{
  border:0;background:transparent;color:#526579;text-align:left;
  padding:13px 12px;border-radius:11px;display:flex;align-items:center;
  gap:12px;font-weight:600;width:100%;
}
.nav-btn:hover,.nav-btn.active{background:var(--blue-light);color:#2466A8}
.nav-icon{width:23px;text-align:center;font-size:18px}
.sidebar-bottom{margin-top:auto}
.main{min-width:0;padding:28px clamp(16px,4vw,40px)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:15px;margin-bottom:30px;
}
.topbar-right{display:flex;align-items:center;gap:12px}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--green-light);font-weight:800;color:#247B51;
}
.page-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:15px;flex-wrap:wrap;margin-bottom:25px;
}
.page-header p{color:var(--muted);margin-bottom:0}
.stats-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;margin-bottom:26px;
}
.stat-card,.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:21px;box-shadow:var(--shadow);
}
.stat-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.stat-icon{
  width:43px;height:43px;border-radius:13px;display:grid;place-items:center;
  font-size:21px;background:var(--blue-light);
}
.stat-number{font-size:30px;font-weight:800;margin:17px 0 5px}
.section-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin:28px 0 15px;
}
.section-heading h2{margin:0}
.pet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pet-card{
  background:white;border:1px solid var(--border);border-radius:17px;
  overflow:hidden;box-shadow:var(--shadow);min-width:0;
}
.pet-card-top{
  background:linear-gradient(135deg,#EAF4FF,#E8F8EF);
  padding:22px;display:flex;align-items:center;gap:14px;
}
.pet-avatar{
  width:58px;height:58px;border-radius:17px;background:white;
  display:grid;place-items:center;font-size:31px;flex-shrink:0;
}
.pet-card-top h3{font-size:18px;margin-bottom:5px;overflow-wrap:anywhere}
.pet-card-body{padding:18px}
.pet-meta{display:grid;gap:10px;margin-bottom:18px}
.meta-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.meta-row span:first-child{color:var(--muted)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.card-actions .btn{flex:1;padding:10px 9px;font-size:13px}
.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;
}
.toolbar .search{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:140px}
.list{display:grid;gap:12px}
.list-row{
  background:white;border:1px solid var(--border);border-radius:14px;
  padding:17px;display:flex;align-items:center;justify-content:space-between;
  gap:15px;
}
.list-row h3{margin-bottom:5px}
.badge{
  display:inline-block;padding:5px 9px;border-radius:20px;
  font-size:11px;font-weight:750;background:var(--blue-light);color:#2466A8;
}
.badge.pending{background:#FFF5D8;color:#876116}
.badge.confirmed,.badge.completed,.badge.up-to-date{background:var(--green-light);color:#247B51}
.badge.cancelled,.badge.overdue{background:#FFF0F0;color:#B93131}
.empty{
  text-align:center;padding:48px 20px;background:white;
  border:1px dashed #C8D8E5;border-radius:17px;
}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty h3{margin-bottom:8px}
.empty p{color:var(--muted);max-width:360px;margin:0 auto 18px}
.notice{
  padding:13px 15px;border-radius:11px;margin-bottom:17px;
  font-size:14px;line-height:1.5;
}
.notice.info{background:var(--blue-light);color:#245B8C}
.notice.error{background:#FFF0F0;color:#A52D2D}
.notice.success{background:var(--green-light);color:#216B48}
.auth-wrap{
  min-height:100vh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(140deg,#EAF4FF,#F7FAFC 55%,#E8F8EF);
}
.auth-card{
  width:min(100%,440px);background:white;padding:clamp(24px,5vw,38px);
  border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);
}
.auth-card .brand{padding:0;margin-bottom:28px}
.auth-card h1{font-size:27px}
.auth-switch{text-align:center;margin:18px 0 0;color:var(--muted);font-size:14px}
.text-btn{background:none;border:0;color:#2466A8;font-weight:700;padding:4px}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(23,43,58,.42);z-index:20;
  display:grid;place-items:center;padding:15px;overflow-y:auto;
}
.modal{
  width:min(100%,650px);max-height:92vh;overflow-y:auto;background:white;
  border-radius:20px;padding:24px;box-shadow:0 20px 70px #172b3a35;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon-btn{border:0;background:var(--bg);border-radius:10px;padding:9px 12px}
.toast{
  position:fixed;bottom:20px;right:20px;z-index:40;max-width:min(90vw,400px);
  padding:14px 18px;background:#172B3A;color:white;border-radius:12px;
  box-shadow:var(--shadow);line-height:1.45;
}
.footer-note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:24px}
.mobile-menu{display:none}
@media(max-width:1050px){
  .pet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .app-layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;z-index:15;left:0;top:0;bottom:0;width:260px;
    transform:translateX(-105%);transition:transform .22s;
    box-shadow:var(--shadow);
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:inline-flex}
  .main{padding:18px 15px 35px}
  .topbar{margin-bottom:24px}
  .stats-grid{grid-template-columns:1fr}
  .stat-card{padding:17px}
  .stat-number{margin:10px 0 4px}
  .pet-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .span-2{grid-column:auto}
  .list-row{align-items:flex-start}
  .list-row .card-actions{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>

<!-- Authentication screen -->
<section id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <div><strong>Vaterina</strong><small>COMPASSIONATE PET CARE</small></div>
    </div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="muted" id="authSubtitle">Sign in to manage your pet's care.</p>
    <div id="authMessage" aria-live="polite"></div>
    <form id="authForm">
      <div class="field">
        <label for="authEmail">Email address</label>
        <input id="authEmail" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
      </div>
      <button id="authSubmit" class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
    <p class="auth-switch">
      <span id="authSwitchText">New to Vaterina?</span>
      <button class="text-btn" id="authSwitch" type="button">Create account</button>
    </p>
    <p class="footer-note">Your account and records are protected by your Supabase access policies.</p>
  </div>
</section>

<!-- Main application -->
<div id="appScreen" class="app-layout hidden">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-icon">🐾</div>
      <div><strong>Vaterina</strong><small>COMPASSIONATE PET CARE</small></div>
    </div>

    <div class="nav-label">Workspace</div>
    <nav class="nav-list" aria-label="Main navigation">
      <button class="nav-btn active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
      <button class="nav-btn" data-page="pets"><span class="nav-icon">🐾</span>My Pets</button>
      <button class="nav-btn" data-page="appointments"><span class="nav-icon">▣</span>Appointments</button>
      <button class="nav-btn" data-page="vaccinations"><span class="nav-icon">✚</span>Vaccinations</button>
    </nav>

    <div class="sidebar-bottom">
      <hr>
      <button class="nav-btn" id="signOutBtn"><span class="nav-icon">↪</span>Sign Out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-right">
        <button class="btn btn-outline mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div>
          <div class="small muted">YOUR PET CARE SPACE</div>
          <strong id="topGreeting">Welcome</strong>
        </div>
      </div>
      <div class="avatar" aria-label="Account">🐾</div>
    </header>
    <div id="globalMessage" aria-live="polite"></div>
    <section id="pageContent"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   VATERINA CONFIGURATION
   Publishable key is intended for browser use.
   Never place a service_role or secret key in this file.
========================================================= */

const SUPABASE_URL = "https://mbqnwtjxrdfwhuyslzeb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PAXoLmtcCT7fgvygE_9brQ_tHwwpqQT";

if (!window.supabase) {
  document.getElementById("authMessage").innerHTML =
    '<div class="notice error">The Supabase library could not load. Check your internet connection and refresh.</div>';
}

const supabaseClient = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

const state = {
  user: null,
  page: "dashboard",
  pets: [],
  appointments: [],
  vaccinations: [],
  loading: false,
  authMode: "signin",
  submittingAuth: false,
  saving: false
};

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function safeDate(value) {
  if (!value) return "Not provided";
  const date = new Date(value + (String(value).length === 10 ? "T00:00:00" : ""));
  if (Number.isNaN(date.getTime())) return "Not provided";
  return date.toLocaleDateString(undefined, {day:"numeric",month:"short",year:"numeric"});
}

function petEmoji(species) {
  const s = String(species || "").toLowerCase();
  if (s.includes("cat")) return "🐱";
  if (s.includes("dog")) return "🐶";
  if (s.includes("rabbit")) return "🐰";
  if (s.includes("bird")) return "🐦";
  if (s.includes("fish")) return "🐠";
  return "🐾";
}

function showToast(message) {
  const root = $("#toastRoot");
  root.innerHTML = '<div class="toast">' + escapeHTML(message) + '</div>';
  window.setTimeout(() => { root.innerHTML = ""; }, 3500);
}

function showMessage(message, type = "info") {
  $("#globalMessage").innerHTML =
    '<div class="notice ' + escapeHTML(type) + '">' + escapeHTML(message) + '</div>';
  if (type !== "error") {
    window.setTimeout(() => { $("#globalMessage").innerHTML = ""; }, 4500);
  }
}

function setAuthMessage(message, type = "error") {
  $("#authMessage").innerHTML = message
    ? '<div class="notice ' + escapeHTML(type) + '">' + escapeHTML(message) + '</div>'
    : "";
}

function displayAuth(mode) {
  state.authMode = mode;
  const signIn = mode === "signin";
  $("#authTitle").textContent = signIn ? "Welcome back" : "Create your account";
  $("#authSubtitle").textContent = signIn
    ? "Sign in to manage your pet's care."
    : "Create an account to start managing your pets.";
  $("#authSubmit").textContent = signIn ? "Sign In" : "Create Account";
  $("#authSwitchText").textContent = signIn ? "New to Vaterina?" : "Already have an account?";
  $("#authSwitch").textContent = signIn ? "Create account" : "Sign in";
  $("#authPassword").autocomplete = signIn ? "current-password" : "new-password";
  setAuthMessage("");
}

function showAuth() {
  $("#authScreen").classList.remove("hidden");
  $("#appScreen").classList.add("hidden");
}

function showApp() {
  $("#authScreen").classList.add("hidden");
  $("#appScreen").classList.remove("hidden");
  $("#topGreeting").textContent = state.user?.email || "Pet owner";
  renderPage();
}

async function handleAuth(event) {
  event.preventDefault();
  if (!supabaseClient || state.submittingAuth) return;

  state.submittingAuth = true;
  const button = $("#authSubmit");
  button.disabled = true;
  button.textContent = "Please wait...";
  setAuthMessage("");

  const email = $("#authEmail").value.trim();
  const password = $("#authPassword").value;

  try {
    let result;
    if (state.authMode === "signin") {
      result = await supabaseClient.auth.signInWithPassword({email, password});
    } else {
      result = await supabaseClient.auth.signUp({email, password});
    }

    if (result.error) throw result.error;

    if (state.authMode === "signup" && !result.data.session) {
      setAuthMessage(
        "Account request received. If email confirmation is enabled, check your inbox before signing in.",
        "info"
      );
      return;
    }

    if (result.data.user) {
      state.user = result.data.user;
      await startAuthenticatedApp();
    }
  } catch (error) {
    console.error("Authentication failed:", error.code || error.status || "unknown");
    setAuthMessage(userFriendlyError(error));
  } finally {
    state.submittingAuth = false;
    button.disabled = false;
    button.textContent = state.authMode === "signin" ? "Sign In" : "Create Account";
  }
}

function userFriendlyError(error) {
  const message = String(error?.message || "").toLowerCase();
  const code = String(error?.code || "").toLowerCase();

  if (message.includes("rate limit") || code.includes("rate_limit") ||
      message.includes("too many requests")) {
    return "Too many authentication requests. Please wait before trying again. Do not repeatedly submit the form.";
  }
  if (message.includes("invalid login credentials")) {
    return "Email or password is incorrect. Check your details and try again later.";
  }
  if (message.includes("email not confirmed")) {
    return "Please confirm your email address before signing in.";
  }
  if (message.includes("already registered")) {
    return "An account may already exist for this email. Try signing in instead.";
  }
  return "The request could not be completed. Please check your connection and try again later.";
}

$("#authForm").addEventListener("submit", handleAuth);
$("#authSwitch").addEventListener("click", () => {
  displayAuth(state.authMode === "signin" ? "signup" : "signin");
});

$("#signOutBtn").addEventListener("click", async () => {
  if (!supabaseClient) return;
  try {
    const {error} = await supabaseClient.auth.signOut();
    if (error) throw error;
    state.user = null;
    state.pets = [];
    state.appointments = [];
    state.vaccinations = [];
    showAuth();
    displayAuth("signin");
  } catch (error) {
    showMessage(userFriendlyError(error), "error");
  }
});

$("#mobileMenu").addEventListener("click", () => $("#sidebar").classList.toggle("open"));

$$(".nav-btn[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    state.page = button.dataset.page;
    $("#sidebar").classList.remove("open");
    $$(".nav-btn[data-page]").forEach(item =>
      item.classList.toggle("active", item.dataset.page === state.page)
    );
    renderPage();
  });
});

/* =========================================================
   SESSION AND DATA
========================================================= */

async function startAuthenticatedApp() {
  showApp();
  await loadAllData();
}

async function loadAllData() {
  if (!state.user || !supabaseClient) return;
  state.loading = true;
  renderPage();

  const requests = [
    supabaseClient.from("pets").select("*").order("created_at", {ascending:false}),
    supabaseClient.from("appointments").select("*").order("appointment_date", {ascending:true}),
    supabaseClient.from("vaccinations").select("*").order("date_given", {ascending:false})
  ];

  try {
    const results = await Promise.all(requests);
    const labels = ["pets", "appointments", "vaccinations"];
    let hasError = false;

    results.forEach((result, index) => {
      if (result.error) {
        console.error("Data load failed:", labels[index], result.error.code || result.error.message);
        hasError = true;
      }
    });

    if (!results[0].error) state.pets = results[0].data || [];
    if (!results[1].error) state.appointments = results[1].data || [];
    if (!results[2].error) state.vaccinations = results[2].data || [];

    if (hasError) {
      showMessage(
        "Some records could not be loaded. Check your Supabase policies and connection. Other available sections remain usable.",
        "error"
      );
    }
  } catch (error) {
    console.error("Data loading failed.");
    showMessage("Unable to load records. Please check your connection.", "error");
  } finally {
    state.loading = false;
    renderPage();
  }
}

function todayISO() {
  const now = new Date();
  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
}

function upcomingAppointments() {
  const today = todayISO();
  return state.appointments.filter(a =>
    a.appointment_date >= today &&
    a.status !== "cancelled" && a.status !== "completed"
  );
}

function vaccineStatus(record) {
  if (!record.next_due_date) return "Unknown";
  const today = todayISO();
  const due = record.next_due_date;
  if (due < today) return "Overdue";

  const future = new Date(today + "T00:00:00");
  future.setDate(future.getDate() + 30);
  const soon = [
    future.getFullYear(),
    String(future.getMonth()+1).padStart(2,"0"),
    String(future.getDate()).padStart(2,"0")
  ].join("-");

  return due <= soon ? "Due soon" : "Up to date";
}

function getPetName(id) {
  return state.pets.find(p => p.id === id)?.name || "Pet unavailable";
}

function renderPage() {
  if (!state.user) return;
  const root = $("#pageContent");
  if (state.loading) {
    root.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><h3>Loading your records</h3><p>Please wait while Vaterina retrieves your information.</p></div>';
    return;
  }

  if (state.page === "pets") root.innerHTML = petsPage();
  else if (state.page === "appointments") root.innerHTML = appointmentsPage();
  else if (state.page === "vaccinations") root.innerHTML = vaccinationsPage();
  else root.innerHTML = dashboardPage();

  bindPageEvents();
}

/* =========================================================
   DASHBOARD
========================================================= */

function dashboardPage() {
  const upcoming = upcomingAppointments().slice(0, 4);
  const nextVaccines = [...state.vaccinations]
    .filter(v => v.next_due_date)
    .sort((a,b) => a.next_due_date.localeCompare(b.next_due_date))

function bindPetToolbar() {
  const search = $("#petSearch");
  if (!search) return;

  const update = () => {
    const q = search.value.trim().toLowerCase();
    const species = $("#petSpecies").value;
    const sort = $("#petSort").value;

    let list = state.pets.filter(p => {
      const matchesText = [p.name,p.breed,p.animal_type]
        .some(v => String(v || "").toLowerCase().includes(q));
      const matchesSpecies = !species ||
        String(p.animal_type || "").toLowerCase() === species.toLowerCase();
      return matchesText && matchesSpecies;
    });

    list.sort((a,b) => {
      if (sort === "name-asc") return String(a.name).localeCompare(String(b.name));
      if (sort === "name-desc") return String(b.name).localeCompare(String(a.name));
      if (sort === "oldest") return String(a.created_at || "").localeCompare(String(b.created_at || ""));
      return String(b.created_at || "").localeCompare(String(a.created_at || ""));
    });

    $("#petResults").innerHTML = petResults(list);
  };

  search.addEventListener("input", update);
  $("#petSpecies").addEventListener("change", update);
  $("#petSort").addEventListener("change", update);
}

async function savePet(event) {
  event.preventDefault();
  if (state.saving || !state.user) return;

  const form = event.currentTarget;
  const petId = form.dataset.editId;
  const name = $("#petName").value.trim();
  const animalType = $("#petType").value.trim();
  const breed = $("#petBreed").value.trim();
  const gender = $("#petGender").value;
  const birthDate = $("#petBirth").value || null;
  const healthNotes = $("#petNotes").value.trim();

  if (!name || !animalType) {
    showToast("Please enter a pet name and species.");
    return;
  }
  if (birthDate && birthDate > todayISO()) {
    showToast("Date of birth cannot be in the future.");
    return;
  }

  const payload = {
    name,
    animal_type: animalType,
    breed: breed || null,
    gender: gender || null,
    birth_date: birthDate,
    health_notes: healthNotes || null
  };

  state.saving = true;
  const button = $("#savePetBtn");
  button.disabled = true;
  button.textContent = "Saving...";

  try {
    let result;
    if (petId) {
      result = await supabaseClient.from("pets")
        .update(payload)
        .eq("id", petId)
        .select()
        .single();
    } else {
      result = await supabaseClient.from("pets")
        .insert({...payload, owner_id:state.user.id})
        .select()
        .single();
    }

    if (result.error) throw result.error;
    if (!result.data) throw new Error("No saved record was returned.");

    closeModal();
    await loadAllData();
    state.page = "pets";
    updateActiveNav();
    renderPage();
    showToast(petId ? "Pet profile updated." : "Pet added successfully.");
  } catch (error) {
    console.error("Pet save failed:", error.code || error.message);
    showToast("Could not save this pet. Your form is still open; check your connection and database permissions.");
    button.disabled = false;
    button.textContent = petId ? "Save changes" : "Save pet";
  } finally {
    state.saving = false;
  }
}

async function saveAppointment(event) {
  event.preventDefault();
  if (state.saving || !state.user) return;
  const petId = $("#appointmentPet").value;
  const clinic = $("#clinicName").value.trim();
  const date = $("#appointmentDate").value;
  const time = $("#appointmentTime").value;
  const reason = $("#appointmentReason").value.trim() || "General check-up";

  if (!petId || !clinic || !date || !time) {
    showToast("Complete all required fields.");
    return;
  }
  if (date < todayISO()) {
    showToast("Choose today or a future date.");
    return;
  }

  state.saving = true;
  const button = $('#appointmentForm button[type="submit"]');
  button.disabled = true;
  button.textContent = "Submitting...";

  try {
    const {data,error} = await supabaseClient.from("appointments").insert({
      owner_id:state.user.id,
      pet_id:petId,
      clinic_name:clinic,
      appointment_date:date,
      appointment_time:time,
      reason,
      status:"pending"
    }).select().single();

    if (error) throw error;
    if (!data) throw new Error("No record returned.");

    closeModal();
    await loadAllData();
    state.page = "appointments";
    updateActiveNav();
    renderPage();
    showToast("Appointment request saved as pending.");
  } catch (error) {
    console.error("Appointment save failed:", error.code || error.message);
    showToast("Could not save the appointment request. Check your database policies.");
    button.disabled = false;
    button.textContent = "Submit request";
  } finally {
    state.saving = false;
  }
}

async function cancelAppointment(id) {
  const appointment = state.appointments.find(a => a.id === id);
  if (!appointment) return;
  if (!confirm("Cancel this appointment request?")) return;

  try {
    const {data,error} = await supabaseClient.from("appointments")
      .update({status:"cancelled"})
      .eq("id",id)
      .select()
      .single();

    if (error) throw error;
    if (!data) throw new Error("No updated record returned.");
    await loadAllData();
    showToast("Appointment marked as cancelled.");
  } catch (error) {
    console.error("Appointment update failed:", error.code || error.message);
    showToast("Could not cancel the appointment. Check the update policy.");
  }
}

  button.textContent = "Saving...";

  const payload = {
    pet_id:petId,
    vaccine_name:vaccineName,
    date_given:dateGiven,
    next_due_date:nextDue,
    clinic_name:clinic || null,
    notes:notes || null
  };

  try {
    let result;
    if (id) {
      result = await supabaseClient.from("vaccinations")
        .update(payload).eq("id",id).select().single();
    } else {
      result = await supabaseClient.from("vaccinations")
        .insert({...payload,owner_id:state.user.id}).select().single();
    }
    if (result.error) throw result.error;
    if (!result.data) throw new Error("No saved record returned.");

    closeModal();
    await loadAllData();
    state.page = "vaccinations";
    updateActiveNav();
    renderPage();
    showToast(id ? "Vaccination record updated." : "Vaccination record saved.");
  } catch (error) {
    console.error("Vaccination save failed:", error.code || error.message);
    showToast("Could not save the vaccination record. Check your database permissions.");
    button.disabled = false;
    button.textContent = "Save record";
  } finally {
    state.saving = false;
  }
}

async function deleteVaccine(id) {
  const record = state.vaccinations.find(v => v.id === id);
  if (!record) return;
  if (!confirm("Delete this vaccination record? This cannot be undone.")) return;

  try {
    const {error} = await supabaseClient.from("vaccinations").delete().eq("id",id);
    if (error) throw error;
    await loadAllData();
    showToast("Vaccination record deleted.");
  } catch (error) {
    console.error("Vaccination delete failed:", error.code || error.message);
    showToast("Could not delete the record. Check your database permissions.");
  }
}

/* =========================================================
   EMPTY STATES AND EVENTS
========================================================= */

function emptyState(icon,title,description,action,label) {
  return `
    <div class="empty">
      <div class="empty-icon">${icon}</div>
      <h3>${escapeHTML(title)}</h3>
      <p>${escapeHTML(description)}</p>
      ${action ? `<button class="btn btn-primary" data-action="${escapeHTML(action)}">${escapeHTML(label)}</button>` : ""}
    </div>
  `;
}

function updateActiveNav() {
  $$(".nav-btn[data-page]").forEach(item =>
    item.classList.toggle("active", item.dataset.page === state.page)
  );
}

function navigate(page) {
  state.page = page;
  updateActiveNav();
  renderPage();
  window.scrollTo({top:0,behavior:"smooth"});
}

function bindPageEvents() {
  bindPetToolbar();
  const root = $("#pageContent");

  root.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", async () => {
      const action = button.dataset.action;
      const id = button.dataset.id;

      if (action === "add-pet") openModal(petForm());
      if (action === "edit-pet") {
        const pet = state.pets.find(p => p.id === id);
        if (pet) openModal(petForm(pet));
      }
      if (action === "view-pet") {
        const pet = state.pets.find(p => p.id === id);
        if (pet) openModal(petDetails(pet));
      }
      if (action === "add-appointment") openModal(appointmentForm());
      if (action === "cancel-appointment") await cancelAppointment(id);
      if (action === "add-vaccine") openModal(vaccineForm());
      if (action === "edit-vaccine") {
        const vaccine = state.vaccinations.find(v => v.id === id);
        if (vaccine) openModal(vaccineForm(vaccine));
      }
      if (action === "delete-vaccine") await deleteVaccine(id);
    });
  });

  root.querySelectorAll("[data-page-link]").forEach(button => {
    button.addEventListener("click", () => navigate(button.dataset.pageLink));
  });

  root.addEventListener("submit", async event => {
    if (event.target.id === "petForm") await savePet(event);
    if (event.target.id === "appointmentForm") await saveAppointment(event);
    if (event.target.id === "vaccineForm") await saveVaccine(event);
  }, {once:true});
}

$("#modalRoot").addEventListener("click", event => {
  if (event.target.matches("[data-modal-backdrop]") ||
      event.target.closest('[data-action="close-modal"]')) {
    closeModal();
  }
});

$("#modalRoot").addEventListener("submit", event => {
  // Modal forms are delegated here so forms remain functional after each render.
  if (event.target.id === "petForm") savePet(event);
  if (event.target.id === "appointmentForm") saveAppointment(event);
  if (event.target.id === "vaccineForm") saveVaccine(event);
});

// The form submit listener is delegated at the modal root. Remove any stale
// modal when the Escape key is pressed.
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && $("#modalRoot").innerHTML) closeModal();
});

if (supabaseClient) {
  supabaseClient.auth.getSession().then(({data,error}) => {
    if (error) {
      console.error("Session check failed:", error.code || error.status);
      showAuth();
      return;
    }
    if (data.session?.user) {
      state.user = data.session.user;
      startAuthenticatedApp();
    } else {
      showAuth();
    }
  }).catch(() => showAuth());

  // Update UI when Supabase reports an auth state change.
  // No automatic login retries are performed.
  supabaseClient.auth.onAuthStateChange((event,session) => {
    if (event === "SIGNED_OUT") {
      state.user = null;
      state.pets = [];
      state.appointments = [];
      state.vaccinations = [];
      showAuth();
    }
  });
} else {
  showAuth();
}
</script>
